# Nginx reverse proxy for Inmobiliaria24 webhook server.
# Place in /etc/nginx/sites-available/ and symlink to sites-enabled/.
# Adjust server_name to your domain.

server {
    listen 443 ssl http2;
    server_name wa.yourdomain.com;

    # SSL — managed by certbot (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/wa.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wa.yourdomain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WhatsApp webhooks can be slow
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }
}

server {
    listen 80;
    server_name wa.yourdomain.com;
    return 301 https://$host$request_uri;
}
