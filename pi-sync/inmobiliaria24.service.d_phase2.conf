[Unit]
OnFailure=inmobiliaria24-retry.service

[Service]
# Needed for the Cloudflare-block auto-recovery (Phase 2): the scraper calls
# `sudo /usr/local/bin/rotate-proxy-ip` when a CF challenge doesn't resolve.
# NoNewPrivileges=yes in the base unit blocks ALL setuid escalation,
# including sudo, so it must be turned back off here. Verified empirically
# via systemd-run: sudo fails outright with NoNewPrivileges=yes.
NoNewPrivileges=no
