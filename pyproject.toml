[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inmobiliaria24"
version = "0.2.0"
description = "Scheduled lead monitor for Inmuebles24 real estate portal"
requires-python = ">=3.12"
dependencies = [
    "playwright==1.58.0",
    "python-dotenv==1.2.2",
    "loguru>=0.7,<0.8",
    "httpx>=0.27,<1",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
]

[project.scripts]
inmobiliaria24 = "inmobiliaria24.main:main"
easybroker = "easybroker.main:main"
reporte-semanal = "reporte_semanal.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/inmobiliaria24", "src/easybroker", "src/reporte_semanal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
